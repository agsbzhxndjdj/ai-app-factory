name: Build Flutter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter scaffold
        run: flutter create --project-name ai_app_factory --org com.example --platforms android,web build_src

      - name: Copy source files from app folder
        run: |
          set -e
          echo "=== app/ contents ==="
          ls -la app/
          if [ ! -f app/pubspec.yaml ]; then echo "ERROR: app/pubspec.yaml missing"; exit 1; fi
          if [ ! -d app/lib ]; then echo "ERROR: app/lib missing"; exit 1; fi
          rm -rf build_src/lib build_src/test
          cp -rf app/lib build_src/lib
          cp app/pubspec.yaml build_src/pubspec.yaml
          if [ -f app/analysis_options.yaml ]; then cp app/analysis_options.yaml build_src/analysis_options.yaml; fi
          if [ -d app/test ]; then
            cp -rf app/test build_src/test
          elif [ -d app/app/test ]; then
            cp -rf app/app/test build_src/test
          fi
          echo "=== copied dart files ==="
          find build_src/lib -name "*.dart" | sort

      - name: Install dependencies
        working-directory: build_src
        run: flutter pub get

      - name: Analyze (info only)
        working-directory: build_src
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Android APK
        working-directory: build_src
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Build Web
        working-directory: build_src
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build_src/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build_src/build/web
