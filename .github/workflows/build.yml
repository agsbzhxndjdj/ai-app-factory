name: Build Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter platform scaffold
        run: |
          flutter create --project-name ai_app_factory --org com.example --platforms android,web build_src

      - name: Copy app source into scaffold
        run: |
          rm -rf build_src/lib build_src/test
          cp -r app/lib build_src/lib
          cp -r app/test build_src/test
          cp app/pubspec.yaml build_src/pubspec.yaml
          cp app/analysis_options.yaml build_src/analysis_options.yaml

      - name: Install dependencies
        working-directory: build_src
        run: flutter pub get

      - name: Analyze
        working-directory: build_src
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: build_src
        run: flutter test

      - name: Build web
        working-directory: build_src
        run: |
          BASE_HREF="${{ vars.PAGES_BASE_HREF }}"
          if [ -z "$BASE_HREF" ]; then
            BASE_HREF="/${{ github.event.repository.name }}/"
          fi
          flutter build web --release --base-href "$BASE_HREF" --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Build Android APK
        working-directory: build_src
        run: |
          flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build_src/build/web

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build_src/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build_src/build/web

  deploy-web:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
